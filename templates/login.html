<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cliente_nombre }} — Ingreso</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            background: #0b1f33;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        .login-card h1 {
            font-size: 20px;
            margin: 0 0 4px 0;
            color: #0b1f33;
        }
        .login-card p.subtitle {
            margin: 0 0 24px 0;
            color: #64748b;
            font-size: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #0b1f33;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #1464f4;
        }
        button {
            width: 100%;
            padding: 11px;
            background: #1464f4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #0f50c3; }
        .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>{{ cliente_nombre }}</h1>
        <p class="subtitle">Demo de inteligencia de datos — acceso restringido</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
